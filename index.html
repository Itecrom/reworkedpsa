<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance | Malawi Political Science Association</title>
<style>
  :root {
    --black: #0a0a0a;
    --red: #cc0000;
    --green: #117733;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--black);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* Animated background glow */
  body::before,
  body::after {
    content: "";
    position: absolute;
    width: 50vw;
    height: 50vw;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
    z-index: 0;
    animation: float 12s ease-in-out infinite;
  }
  body::before {
    background: var(--red);
    top: -10vw;
    left: -10vw;
  }
  body::after {
    background: var(--green);
    bottom: -10vw;
    right: -10vw;
    animation-delay: -6s;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(4vw, 4vw) scale(1.15); }
  }

  .wrap {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px 24px;
    max-width: 720px;
    width: 100%;
  }

  .badge {
    display: inline-block;
    border: 2px solid var(--green);
    color: var(--green);
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 26px;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(17,119,51,0.5); }
    50% { box-shadow: 0 0 0 12px rgba(17,119,51,0); }
  }

  .logo {
    font-size: 14px;
    letter-spacing: 4px;
    color: #bbb;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-size: clamp(34px, 7vw, 64px);
    font-weight: 800;
    line-height: 1.05;
    margin-bottom: 14px;
    background: linear-gradient(90deg, var(--red), #fff, var(--green));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 4s linear infinite;
  }

  @keyframes shimmer {
    to { background-position: 200% center; }
  }

  p.sub {
    color: #cfcfcf;
    font-size: 16px;
    margin-bottom: 36px;
  }

  .countdown {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .unit {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-top: 3px solid var(--red);
    border-radius: 12px;
    padding: 18px 10px;
    min-width: 92px;
    backdrop-filter: blur(6px);
  }
  .unit:nth-child(2) { border-top-color: var(--green); }
  .unit:nth-child(3) { border-top-color: var(--red); }
  .unit:nth-child(4) { border-top-color: var(--green); }

  .unit .num {
    font-size: 40px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #fff;
  }

  .unit .lbl {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #9a9a9a;
    margin-top: 6px;
  }

  .contact {
    font-size: 15px;
    color: #ddd;
  }
  .contact a {
    color: var(--green);
    text-decoration: none;
    font-weight: 700;
    border-bottom: 1px dashed var(--green);
  }
  .contact a:hover { color: #fff; border-color: #fff; }

  .spinner {
    width: 46px;
    height: 46px;
    border: 4px solid rgba(255,255,255,0.15);
    border-top-color: var(--red);
    border-right-color: var(--green);
    border-radius: 50%;
    margin: 0 auto 28px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">Site Maintenance</div>
    <div class="logo">Malawi Political Science Association</div>
    <h1>We'll Be Back Soon</h1>
    <p class="sub">Our website is currently undergoing scheduled maintenance. Thank you for your patience.</p>

    <div class="spinner"></div>

    <div class="countdown" id="countdown">
      <div class="unit"><div class="num" id="days">00</div><div class="lbl">Days</div></div>
      <div class="unit"><div class="num" id="hours">00</div><div class="lbl">Hours</div></div>
      <div class="unit"><div class="num" id="mins">00</div><div class="lbl">Minutes</div></div>
      <div class="unit"><div class="num" id="secs">00</div><div class="lbl">Seconds</div></div>
    </div>

    <p class="contact">
      For more information, call or WhatsApp:
      <a href="https://wa.me/265992919716">0992 919 716</a>
    </p>
  </div>

<script>
  // Countdown target: TOMORROW at 6:00 PM (local time)
  (function () {
    var target = new Date();
    target.setDate(target.getDate() + 1);
    target.setHours(18, 0, 0, 0);

    var el = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      mins: document.getElementById('mins'),
      secs: document.getElementById('secs')
    };

    function pad(n) { return (n < 10 ? '0' : '') + n; }

    function tick() {
      var diff = target - new Date();
      if (diff <= 0) {
        el.days.textContent = el.hours.textContent = el.mins.textContent = el.secs.textContent = '00';
        document.querySelector('h1').textContent = "We're Back Online";
        document.querySelector('.sub').textContent = "Thank you for your patience. The site is live again.";
        clearInterval(timer);
        return;
      }
      var s = Math.floor(diff / 1000);
      var d = Math.floor(s / 86400);
      var h = Math.floor((s % 86400) / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = s % 60;
      el.days.textContent = pad(d);
      el.hours.textContent = pad(h);
      el.mins.textContent = pad(m);
      el.secs.textContent = pad(sec);
    }

    tick();
    var timer = setInterval(tick, 1000);
  })();
</script>
</body>
</html>
